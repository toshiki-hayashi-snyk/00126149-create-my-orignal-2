apply plugin: 'com.jfrog.artifactory'

dependencies {
    api(group: 'com.sun.mail', name: 'smtp', version: '2.0.1')
    api 'jakarta.mail:jakarta.mail-api:2.1.3'
    runtimeOnly 'org.eclipse.angus:angus-mail:2.0.3'
    api 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'
    api 'jakarta.ejb:jakarta.ejb-api:4.0.1'
    api "commons-httpclient:commons-httpclient:3.1"
    api 'commons-io:commons-io:2.16.1'
    api "org.slf4j:slf4j-api:2.0.12"

    ['solr-solrj', 'solr-solrj-jetty', 'solr-solrj-zookeeper'].each { artifact ->
        api("org.apache.solr:${artifact}:10.0.0") {
            exclude group: "com.fasterxml.jackson.core"
            exclude group: "org.slf4j"
            exclude group: "io.netty"
        }
    }
    api 'org.apache.httpcomponents:httpclient:4.5.14'
    api "org.apache.lucene:lucene-core:3.0.2"
    api group: 'net.sf.ehcache', name: 'ehcache-core', version: '2.6.11'
    api "com.google.zxing:core:3.5.3"
    api "com.google.zxing:javase:3.5.3"
	//api "com.itextpdf:itextpdf:5.5.6"
    api 'org.hornetq:hornetq-jakarta-client:2.4.9.Final'
    api 'org.jgroups:jgroups:3.3.4.Final'
    api 'jakarta.jms:jakarta.jms-api:3.1.0'
    api 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    api 'org.apache.commons:commons-fileupload2-jakarta-servlet6:2.0.0-M2'
    api "org.apache.commons:commons-lang3:3.4"
    api(group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.61')
    api(group: 'org.bouncycastle', name: 'bcmail-jdk15on', version: '1.61')

    api (group: 'org.apache.poi', name: 'poi', version: '5.5.1') {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    }
    testRuntimeOnly 'org.glassfish.corba:glassfish-corba-orb:4.2.5'
    api (group: 'org.apache.poi', name: 'poi-ooxml', version: '5.5.1') {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    }
    api (group: 'org.apache.poi', name: 'poi-scratchpad', version: '5.5.1') {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    }
    api "org.apache.pdfbox:pdfbox:2.0.32"
    api(group: 'org.apache.xmlgraphics', name: 'batik-transcoder', version: '1.18') {
        exclude group: 'xalan', module: 'xalan'
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    api group: 'xalan', name: 'xalan', version: '2.7.3'
    api group: 'xalan', name: 'serializer', version: '2.7.3'
    api(group: 'org.apache.xmlgraphics', name: 'xmlgraphics-commons', version: '2.1') {
        exclude group: 'commons-io', module: 'commons-io'
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    api 'org.apache.xmlgraphics:batik-codec:1.7'

    api 'commons-lang:commons-lang:2.3'
    api 'org.json:json:20231013'
    api "commons-collections:commons-collections:3.2.2"
    api "org.springframework:spring-core:6.2.15"
    api "com.couchbase.client:java-client:3.3.4"
    api 'net.spy:spymemcached:2.12.1'
    api group: 'io.netty', name: 'netty-all', version: '4.1.44.Final'
    // Earlier it was coming from solr 9.4 client but now we using solr 5.2 client so updated transitive dependency version we
    // getting from solr 9.4 client version
    api "com.fasterxml.jackson.core:jackson-databind:2.15.2"
    api "org.apache.pdfbox:xmpbox:2.0.32"
	api group: 'com.drewnoakes', name: 'metadata-extractor', version: '2.16.0'
    api 'org.jboss.spec.javax.rmi:jboss-rmi-api_1.0_spec:1.0.6.Final'
	
}
